<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/styles.css">
<title>Mnemo Scanner</title>
</head>
<body>
<header class="bar">
  <span class="wordmark">MNEMO</span>
  <span class="pill" id="state" data-state="idle"><i></i><b>IDLE</b></span>
  <button class="ghost" id="alerts" aria-pressed="false">Alerts</button>
</header>

<main>
  <section class="tiles" aria-label="Live counters">
    <div class="tile"><b id="s-scanned">0</b><span>scanned</span></div>
    <div class="tile"><b id="s-rate">0</b><span>per min</span></div>
    <div class="tile hit"><b id="s-hits">0</b><span>hits</span></div>
  </section>

  <canvas id="spark" width="600" height="64" aria-hidden="true"></canvas>

  <div class="viewport" id="viewport" role="log" aria-label="Scanner output">
    <div id="log"></div>
  </div>
  <button class="jump" id="jump" hidden>Jump to live</button>

  <p class="live" id="announce" aria-live="polite"></p>

  <section class="controls">
    <button class="primary" id="toggle">Start</button>
    <button class="outline" id="recheck">Recheck</button>
    <button class="outline" id="export">Export</button>
  </section>
</main>

<nav class="tabs">
  <a href="#feed" class="on">Feed</a>
  <a href="#hits">Hits</a>
  <a href="#settings">Settings</a>
</nav>

<script type="module" src="/app.js"></script>
</body>
</html>
